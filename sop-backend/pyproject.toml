# ---------------------------------------------------------------------
# pyproject.toml — 이 프로젝트의 "이름표"이자 "필요한 부품 목록"
#
# pip 같은 설치 도구가 이 파일을 읽어서
#   1) 프로젝트 이름/파이썬 버전
#   2) 실행에 필요한 라이브러리(dependencies)
#   3) 개발·테스트할 때만 필요한 라이브러리(optional dev)
#   4) 테스트 도구(pytest) 설정
# 을 알아냅니다.
# ---------------------------------------------------------------------

[project]
name = "sop-backend"
version = "2.0.0"
description = "SOP Studio 편집기 문서를 PostgreSQL(15+, 17 확인)에 버전 단위로 저장·조회하는 FastAPI 서버. SOP 참조는 문서 id 로 연결"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",          # 웹 API 프레임워크
    "uvicorn[standard]>=0.30", # FastAPI 앱을 실제로 띄우는 서버 프로그램
    "psycopg[binary]>=3.2",    # PostgreSQL 에 접속하는 드라이버 (binary = 컴파일 없이 바로 설치)
    "psycopg-pool>=3.2",       # DB 연결을 미리 열어 두고 빌려 쓰는 "연결 풀"
    "pydantic>=2.7",           # 요청/응답 JSON 모양 검사
    "httpx>=0.27",             # HTTP 클라이언트. 이관 도구(app/tools/import_library.py)가 서버를 부를 때 사용
]

[project.optional-dependencies]
# 개발·테스트용. `pip install -e ".[dev]"` 또는 `pip install -r requirements-dev.txt` 로 설치
dev = [
    "pytest>=8",              # 테스트 실행기
    "pytest-asyncio>=0.24",   # async 함수 테스트 지원
    "httpx>=0.27",            # 테스트에서 API 를 호출하는 가짜 브라우저 역할
    "pgserver",               # 파이썬 안에 들어 있는 "내장 PostgreSQL".
                              # 따로 DB 를 설치하지 않아도 pytest 가 임시 DB 를 만들어 테스트합니다.
                              # (TEST_DATABASE_URL 환경변수가 있으면 그 DB 를 쓰고 이건 쓰지 않습니다)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"   # async def 테스트 함수를 별도 표시 없이 그대로 실행
testpaths = ["tests"]   # 테스트 파일이 있는 폴더

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 파이썬 패키지로 취급할 폴더만 적습니다. static/ sql/ examples/ 는 코드가 아니라서 제외.
packages = ["app", "app.routers", "app.tools"]
